name: EGHUB CI

on:
  push:
    paths:
      - "EGHUB/**"
      - ".github/workflows/eghub-ci.yml"
  pull_request:
    paths:
      - "EGHUB/**"
      - ".github/workflows/eghub-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: EGHUB

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: EGHUB/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm functions:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:lighthouse

  database-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: EGHUB/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:test
